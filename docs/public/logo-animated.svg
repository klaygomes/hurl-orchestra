<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 720 560" width="240" height="187" role="img" aria-label="hurl-orchestra: a cauliflower conductor beats time while a dependency graph lights up one wave at a time" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round">
<style>
.staff path{fill:none;stroke:#c084fc;stroke-opacity:.35;stroke-width:4}
.edge{fill:none;stroke:url(#chalk);stroke-width:12;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 5.76s infinite}
.note{fill:#f3e8ff;stroke:#25063c;stroke-width:9;transform-box:fill-box;transform-origin:center;animation:pop 5.76s infinite}
.fin{animation-name:finale}
.spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:spark 5.76s infinite}
.glow{animation:glow 5.76s 3.48s infinite}
.baton{transform-box:view-box;transform-origin:498px 468px;animation:beat .96s .12s ease-in-out infinite}
.body{transform-box:view-box;transform-origin:400px 560px;animation:bob .96s .12s ease-in-out infinite}
@keyframes pop{0%{fill:#f3e8ff;transform:scale(.55)}4%{fill:#7e23b3;transform:scale(1.28)}9%{fill:#7e23b3;transform:scale(1)}62%{fill:#7e23b3;transform:scale(1)}72%,100%{fill:#f3e8ff;transform:scale(.55)}}
@keyframes finale{0%{fill:#f3e8ff;transform:scale(.55)}4%{fill:#fad30b;transform:scale(1.45)}10%{fill:#fad30b;transform:scale(1)}40%{fill:#fad30b;transform:scale(1)}50%,100%{fill:#f3e8ff;transform:scale(.55)}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}8%{stroke-dashoffset:0;opacity:1}56%{stroke-dashoffset:0;opacity:1}66%{stroke-dashoffset:0;opacity:0}67%,100%{stroke-dashoffset:1;opacity:0}}
@keyframes spark{0%{opacity:0;transform:scale(0) rotate(0)}3%{opacity:1;transform:scale(1.2) rotate(45deg)}14%,100%{opacity:0;transform:scale(0) rotate(120deg)}}
@keyframes glow{0%,100%{opacity:.35}6%{opacity:.9}30%{opacity:.35}}
@keyframes beat{0%,30%{transform:rotate(-24deg)}50%{transform:rotate(16deg)}70%,100%{transform:rotate(-24deg)}}
@keyframes bob{0%,35%,100%{transform:translateY(0)}50%{transform:translateY(-12px) rotate(-1.5deg)}62%{transform:translateY(2px)}}
@media (prefers-color-scheme:dark){.note{stroke:#f3e8ff;stroke-width:7}.staff path{stroke-opacity:.5}}
@media (prefers-reduced-motion:reduce){.edge,.note,.spark,.glow,.baton,.body{animation:none}.edge{stroke-dashoffset:0}.note{fill:#7e23b3}.fin{fill:#fad30b}}
</style>
<defs>
<linearGradient id="chalk" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7e23b3"/><stop offset=".55" stop-color="#c63f75"/><stop offset="1" stop-color="#fad30b"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#fad30b" stop-opacity=".75"/><stop offset=".6" stop-color="#c63f75" stop-opacity=".18"/><stop offset="1" stop-color="#c63f75" stop-opacity="0"/></radialGradient>
</defs>
